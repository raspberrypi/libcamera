general:
  disable: []
  plot: []
  alsc:
    do_alsc_colour: 1
    luminance_strength: 0.5
  awb:
    # Algorithm can either be 'grey' or 'bayes'
    algorithm: bayes
    # Priors is only used for the bayes algorithm. They are defined in linear
    # space. A good staring point is:
    # - lux: 0
    #   ct: [ 2000, 3000, 13000 ]
    #   probability: [ 1.005, 1.0, 1.0 ]
    # - lux: 800
    #   ct: [ 2000, 6000, 13000 ]
    #   probability: [ 1.0, 1.01, 1.01 ]
    # - lux: 1500
    #   ct: [ 2000, 4000, 6000, 6500, 7000, 13000 ]
    #   probability: [ 1.0, 1.005, 1.032, 1.037, 1.01, 1.01 ]
    priors:
      - lux: 0
        ct: [ 2000, 13000 ]
        probability: [ 1.0, 1.0 ]
    AwbMode:
      Auto:
        lo: 2500
        hi: 8000
      Incandescent:
        lo: 2500
        hi: 3000
      Tungsten:
        lo: 3000
        hi: 3500
      Fluorescent:
        lo: 4000
        hi: 4700
      Indoor:
        lo: 3000
        hi: 5000
      Daylight:
        lo: 5500
        hi: 6500
      Cloudy:
        lo: 6500
        hi: 8000
      # One custom mode can be defined if needed
      #Custom:
      #  lo: 2000
      #  hi: 1300
  macbeth:
    small: 1
    show: 0
#  blacklevel: 32